# cspell:words aiohttp asyncio dateutil pylint pytest setuptools

[build-system]
requires = [ "setuptools >= 64" ]
build-backend = "setuptools.build_meta"

[project]
name = "benjaminhamon-standard-extensions"
version = "2.0.0+development"
description = "Modules to extend the python standard library"
requires-python = ">= 3.11"

authors = [
    { name = "Benjamin Hamon", email = "development@benjaminhamon.com" }
]

maintainers = [
    { name = "Benjamin Hamon", email = "development@benjaminhamon.com" }
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

dependencies = []

[project.optional-dependencies]
all = [
    "aiohttp ~= 3.12.15",
    "python-dateutil ~= 2.9.0",
    "PyYAML ~= 6.0.3",
    "requests ~= 2.32.5",
]

dev = [
    "Flask ~= 3.1.2",
    "mockito ~= 1.5.4",
    "pylint ~= 3.3.8",
    "pytest ~= 8.4.2",
    "pytest-asyncio ~= 1.2.0",
    "pytest-json ~= 0.4.0",
]

[project.urls]
"Source" = "https://github.com/BenjaminHamon/StandardExtensions"

[tool.setuptools]
license-files = [ "../About.md", "../License.txt" ]
